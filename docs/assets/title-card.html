<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BASIC title card</title>
<style>
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("file:///usr/share/fonts/truetype/jetbrains-mono-zorin-os/JetBrainsMono-Regular.ttf"); }
  @font-face { font-family: "Archivo"; font-weight: 400; src: url("../../node_modules/@fontsource/archivo/files/archivo-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 600; src: url("../../node_modules/@fontsource/archivo/files/archivo-latin-600-normal.woff2") format("woff2"); }

  :root {
    --ink: oklch(0.17 0.012 258);
    --ink-2: oklch(0.22 0.014 258);
    --paper: oklch(0.97 0.004 258);
    --soft: oklch(0.82 0.01 258);
    --hivis: oklch(0.89 0.17 100);
  }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 480px;
    background: var(--ink);
    display: grid;
    grid-template-columns: 1fr 520px;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
    box-sizing: border-box;
    font-family: "Archivo", sans-serif;
    color: var(--paper);
  }
  .art {
    margin: 0;
    font-family: "JetBrains Mono", monospace;
    font-size: 25px;
    line-height: 1;
    white-space: nowrap;
    color: var(--hivis);
  }
  .art .sh { color: oklch(0.58 0.1 96); }
  .art i { display: inline-block; width: 15px; height: 25px; vertical-align: top; font-style: normal; text-align: center; }
  .art i.b { background: var(--hivis); }
  .line {
    margin: 40px 0 0;
    font-size: 30px;
    line-height: 1.3;
    font-weight: 400;
    color: var(--paper);
    max-width: 16em;
  }
  .view {
    position: relative;
    height: 340px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 58px 62px 60px;
    box-sizing: border-box;
    background: var(--ink-2);
    border-radius: 18px;
  }
  .corner { position: absolute; width: 36px; height: 36px; border-color: var(--hivis); border-style: solid; border-width: 0; }
  .tl { top: 18px; left: 18px; border-top-width: 3px; border-left-width: 3px; }
  .tr { top: 18px; right: 18px; border-top-width: 3px; border-right-width: 3px; }
  .bl { bottom: 18px; left: 18px; border-bottom-width: 3px; border-left-width: 3px; }
  .br { bottom: 18px; right: 18px; border-bottom-width: 3px; border-right-width: 3px; }
  .bar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
  .bar b { height: 8px; border-radius: 2px; background: oklch(0.32 0.014 258); }
  .bar b.done { background: var(--hivis); }
  .words { display: flex; flex-direction: column; gap: 14px; }
  .step { font-size: 17px; font-weight: 600; letter-spacing: 0.08em; color: var(--soft); margin-bottom: 12px; }
  .say { font-size: 25px; line-height: 1.35; margin: 0; }
  .say.pass { color: var(--hivis); font-weight: 600; }
</style>
</head>
<body>
  <div>
    <pre class="art" id="art"></pre>
    <p class="line">Smart glasses that teach you to install a home battery.</p>
  </div>
  <div class="view">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div>
      <div class="step">STEP 8 OF 12</div>
      <div class="bar"><b class="done"></b><b class="done"></b><b class="done"></b><b class="done"></b><b class="done"></b><b class="done"></b><b class="done"></b><b class="done"></b><b></b><b></b><b></b><b></b></div>
    </div>
    <div class="words">
      <p class="say">“Lower the metal shell over the gray top until it sits flush.”</p>
      <p class="say pass">“Metal shell is seated flush. Confirmed.”</p>
    </div>
  </div>
<script>
  const rows = [
    "██████╗  █████╗ ███████╗██╗ ██████╗",
    "██╔══██╗██╔══██╗██╔════╝██║██╔════╝",
    "██████╔╝███████║███████╗██║██║     ",
    "██╔══██╗██╔══██║╚════██║██║██║     ",
    "██████╔╝██║  ██║███████║██║╚██████╗",
    "╚═════╝ ╚═╝  ╚═╝╚══════╝╚═╝ ╚═════╝",
  ];
  document.getElementById('art').innerHTML = rows
    .map((r) => [...r].map((c) => (c === '█' ? '<i class="b"></i>' : c === ' ' ? '<i></i>' : `<i class="sh">${c}</i>`)).join(''))
    .join('<br>');
</script>
</body>
</html>
