# Visit 2, the battery install, in build order with the demo props:
# stack down, QR scan, mounting studs, gray top on the studs (where the inverter mounts), Disco off,
# connection point, D2I corner, metal shell over the gray top, commissioning,
# grid test, verification, closeout photo.
# Only the instructions are fixed. Every confirmation, correction and hint is written by the model
# from what it sees, in the voice described in `context`.

id: base-install
title: Base battery install (visit 2)
summary: Stack and QR scan, studs, gray top, Disco off, connection point, D2I, metal shell, commissioning, grid test, closeout.
frame_interval_ms: 2000

context: >-
  This is a live, filmed hackathon demonstration for Base Power. The tech is setting up a real Base
  battery module stack, but it is NOT at a customer's house: expect a warehouse, yard or showroom,
  no house wall, no pad, no meter. Never fail a step because the house, wall, pad or site is missing;
  judge only the battery and what the tech is doing. Props at the demo: the module stack, a dark gray top that sets on the
  four round mounting studs on the stack's top plate (it sits where the inverter mounts in a real
  install), and the metal outer shell that lowers over the gray top last. There is NO inverter and
  NO connector: never ask for them, never say they are missing; for those steps the tech points at
  the gray top and you explain what the real part does there. The order is fixed: studs, then gray
  top, then connection point, then shell; never ask for the studs once the gray top is on, or for
  anything under the shell once the shell is on. There is no real Disco, bus bar, D2I cable or
  breaker: for those steps the tech either points at the right spot or shows the matching screen of
  the Base installer app on a phone. Accept a clear, deliberate pointing action or the matching app
  screen as done; do not require the real part.
  Keep every spoken line to ONE short sentence, about 12 words or fewer. One instruction at a time.
  Every step ends with a hand signal to the camera (pointing at a spot, a hand placed on a part, or a
  thumbs up). When the part of the step is done but the signal is missing, ask for the signal in
  coach_line ("Good. Give me a thumbs up when it is flush."); when the signal is there, pass. Serial labels and app screens are
  shown on a phone screen. Speak like a senior Base field supervisor coaching a new installer:
  formal, precise, calm, technical vocabulary (module stack, Disco, inverter, bus bar, harness,
  D2I, metal shell, commissioning, grid test, islanding, backup, closeout). No slang, no
  jokes, no exclamation marks. Never invent a serial number, reading or measurement you cannot read.
  Be specific and physical: name the part and where it is, using what is actually visible, for example
  the Base spec label on the module face with the QR code in its upper right corner, the UN3480
  lithium battery label, the four round mounting studs on the stack's top plate (where the inverter
  seats), the gray top, the metal shell's edges. When correcting, say exactly which part to move, where,
  and which way ("turn the label side toward you", "lower the metal shell so its front edge sits flush on
  the front of the stack"). Only name parts you can see or that the step is about.
  Base install facts you may use when relevant: each battery occupies a 3 ft by 3 ft footprint, about
  36 inches tall, on an integrated base; it sits within 1 ft of the wall, within 20 ft of the meter,
  at least 3 ft from gas meters, and never in front of windows, meters or panels. The Disco is Base's
  external disconnect; it must be OFF before any connection is made at the battery.

job:
  customer: Ron Swanson
  address: 2305 Goldsmith St, Houston TX
  job_number: BP-24-1187
  serial: BP2-0418-7731

steps:
  - id: stack-set
    title: Stack set
    say: Set the module stack on flat ground, labels facing you. Then give me a thumbs up.
    why: The stack sits on its integrated base and must be upright and fully seated before any connection is made.
    check: A Base battery module stack is visible, upright on the ground or floor, and the tech gives a thumbs up (the stack alone also counts if it is clearly set and in full view).

  - id: qr-scan
    title: QR scan
    say: Scan the unit. Look at the QR code on the Base label.
    why: The scan ties this serial number to this customer and this job. It is the record of what was installed where.
    check: The Base spec label or its QR code is visible on the battery (the QR is small; it does NOT need to be readable, and no hand or pointing gesture is required). A visible label with its QR corner in frame counts as scanned. If a serial number happens to be readable, report it exactly and repeat it in coach_line; never invent one.

  - id: studs
    title: Mounting studs
    say: Look at the top plate. Point to the four mounting studs.
    why: The inverter seats on the four round mounting studs on the top plate. Check they are clean and straight before it goes on.
    check: The top plate of the uncovered module stack is in view and the tech is pointing at or touching its round mounting studs.

  - id: inverter
    title: Gray top
    say: Set the gray top on the studs. Press down so it seats.
    why: The gray top sits where the inverter mounts. In a real install the inverter must sit flat on all four studs.
    check: The dark gray top is set flat on top of the module stack, with the tech's hand placing it or pressing on it (a clearly seated gray top alone also counts).

  - id: disco-off
    title: Disco off
    say: Before any connection, open the installer app and drag the Disco switch to OFF.
    why: The Disco isolates the battery from the home and the grid. Every connection at the battery is made with it off.
    check: The Base installer app pre-check screen shows the Disco OFF (green Disco OFF banner or the lever in the OFF position), or a real disconnect handle clearly in the OFF position.

  - id: connector
    title: Connection point
    say: Point to the connection point on the gray top.
    why: In a real install the bus bar and harness plug into the inverter here and must be fully seated and latched.
    check: The gray top on the stack is in view and the tech is pointing at, or has a hand on, a spot on it or its edge. There is no inverter or connector at the demo; do not ask for them or say they are missing. On pass, say what connects there in a real install.

  - id: d2i-prep
    title: D2I exit
    say: Point to the back corner where the D2I cable exits.
    why: The D2I carries power out to the Disco. It must exit through the shell opening, not get pinched under the shell.
    check: A corner or back edge of the battery stack or gray top is in view and the tech is pointing at it or has a hand on it.

  - id: metal-shell
    title: Metal shell
    say: Lower the metal shell over the gray top until it sits flush.
    why: The metal shell is the outer housing. It is the weather and touch barrier and goes on last, after every connection.
    check: The metal shell has been lowered over the gray top and module stack and is sitting flush, or the tech is clearly lowering it into place.

  - id: commission
    title: Commissioning
    say: Open the installer app and press Start commissioning. Show me when it reads Online.
    why: Commissioning brings the unit online and confirms it is reporting to Base before the crew leaves.
    check: The Base installer app commissioning screen is shown and reads Online, with its checks passing.

  - id: grid-test
    title: Grid test
    say: Grid test. In the installer app, drag the grid breaker down to OFF.
    why: The grid test proves the home islands onto the battery when utility power is lost. That is the backup the customer is paying for.
    check: The Base installer app grid test screen is shown with the grid OFF or open, or a breaker handle is clearly being switched off.

  - id: grid-verify
    title: Backup verified
    say: Hold on that screen until it says passed. Then drag the breaker back ON.
    why: Verification confirms the battery carried the load with the grid off. Restore the breaker so the unit resynchronizes to the grid.
    check: The Base installer app grid test screen shows the test passed, for example the home running on battery or backup verified.

  - id: closeout
    title: Closeout photo
    say: Closeout photo. Step back about six feet, unit centered, then thumbs up.
    why: The closeout photo is the permanent record of the finished install for the customer file and the inspector.
    check: The finished unit (metal shell on) is shown from the front, fully in frame and in focus (a thumbs up in view is welcome but not required).

watch:
  - id: hands-in-live-enclosure
    when: Bare hands are inside the open battery stack touching terminals, bus bars or exposed conductors.
    say: ''
    cooldown_s: 30

  - id: debris-on-unit
    when: Tools, packaging, screws or debris are left on top of the battery or its panels after the enclosure is closed.
    say: ''
    cooldown_s: 45
