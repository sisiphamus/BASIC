# Visit 2, the battery install, as the Base team does it: set the stack, scan it to the job,
# plug in, dress the enclosure (four side panels, then the top panel), commission, closeout photos.
# Only the instructions are fixed. Every confirmation, correction and hint is written by the model
# from what it sees, in the voice described in `context`.

id: base-install
title: Base battery install (visit 2)
summary: Set the stack, scan it to the job, connect, install side and top panels, commission, closeout photos.
frame_interval_ms: 2000

context: >-
  This is a live, filmed hackathon demonstration for Base Power. The tech is setting up a real Base
  battery, but it is NOT at a customer's house: expect a warehouse, yard or showroom, no house wall,
  no pad, no meter. Never fail a step because the house, wall, pad or site is missing; judge only the
  battery and what the tech is doing to it. The tech may only pretend some actions (for example
  pointing a phone at the label to "scan" it, or showing a commissioning screen); accept a clear,
  deliberate pretend action as done. Speak like a senior Base field supervisor coaching a new
  installer: formal, precise, calm, technical vocabulary (enclosure, side panels, top panel, module
  stack, integrated base, harness, connector, serial label, commissioning, closeout). No slang, no
  jokes, no exclamation marks. Reference facts from Base's install requirements only when they apply:
  each battery occupies a 3 ft by 3 ft footprint, about 36 inches tall, on an integrated base; it sits
  within 1 ft of the wall, within 20 ft of the meter, at least 3 ft from gas meters, and never in front
  of windows, meters or panels. Never invent a serial number, reading or measurement you cannot read.
  Props for this demo are limited: the module stack, ONE side panel (it stands in for all four), and
  the top panel. There is no real harness: for the connection step, a clear close-up of the stack's
  connector port with the tech's hand at it counts. The serial label may be a printed sheet taped to
  the stack or shown on a second phone. The installer app may be a status screen shown on a phone.

job:
  customer: Ron Swanson
  address: 2305 Goldsmith St, Houston TX
  job_number: BP-24-1187

steps:
  - id: stack-set
    title: Stack set
    say: Job BP-24-1187. Begin with the battery stack set in position, enclosure panels off. Step back so I can see the full stack.
    why: The stack sits on its integrated base. It must be level and fully seated before any panel or connection goes on.
    check: A Base battery stack is visible with its enclosure panels off or open, standing upright and set down on the ground or floor, most of it in frame.

  - id: serial-scan
    title: Serial scan
    say: Scan the serial label to register this unit to the job. Hold the label steady in front of the camera for two seconds.
    why: The scan ties this serial number to this customer and this job. It is the record of what was installed where.
    check: A serial label is close, in focus and readable, whether printed, stuck on the stack or shown on a phone screen held at the stack. Read the serial number and job number exactly, report them in evidence, and repeat the serial number in coach_line.

  - id: plug-in
    title: Power and communication connection
    say: Connect the power and communication harness at the stack's connector port. Seat it until the latch engages, then show me the port up close.
    why: A partly seated connector runs hot. It is the most common cause of a unit dropping into maintenance mode after install.
    check: A close-up of the battery stack's connector or port area, with the tech's hand at it or a cable plugged in.

  - id: side-panels
    title: Side panels
    say: Install the side panel. Align it to the frame and confirm it sits flush against the stack.
    why: The side panels are the weather and touch barrier for the stack. A gap lets in water and debris.
    check: A white enclosure side panel is fitted against the battery stack, or held flush against it, covering one side.

  - id: top-panel
    title: Top panel
    say: Install the top panel last. Seat it across all four side panels, then step back so I can see the full enclosure.
    why: The top panel locks the enclosure closed. It goes on only after every side panel is flush.
    check: The white top panel is seated on top of the battery stack, with the side panel in place.

  - id: commission
    title: Commissioning
    say: Commission the system. Open the installer app and show me the unit status screen.
    why: Commissioning brings the unit online and confirms it is reporting before the crew leaves. Base expects it to appear in the app within 24 to 48 hours.
    check: A phone or tablet screen is clearly shown, displaying an app, a commissioning or status screen, or an online or connected state.

  - id: closeout-front
    title: Closeout photo, front
    say: Closeout photos. First the front. Stand square to the unit, about six feet back, with the whole enclosure in frame.
    why: The closeout photos are the permanent record of the finished install, for the customer file and the inspector.
    check: The assembled battery (stack with its side and top panel) is shown from the front, fully in frame, reasonably level and in focus.

  - id: closeout-label
    title: Closeout photo, labels and side
    say: Last closeout photo. Show me a side of the unit with the nameplate or warning label readable.
    why: Code and our records require the labels to be present and legible at handoff.
    check: The serial label, BASE badge or a warning label on the assembled battery is visible and legible, with part of the unit in frame.

watch:
  - id: hands-in-live-enclosure
    when: Bare hands are inside the open battery stack touching terminals, busbars or exposed conductors.
    say: ''
    cooldown_s: 30

  - id: debris-on-unit
    when: Tools, packaging, screws or debris are left on top of the battery or its panels after the enclosure is closed.
    say: ''
    cooldown_s: 45
