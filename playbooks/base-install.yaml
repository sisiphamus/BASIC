# Visit 2, the battery install, in the order a Base installer described it:
# stack down + QR scan, Disco off, inverter, bus/harness, D2I prep, panels + D2I routing,
# commissioning, grid test, verification, closeout photo.
# Only the instructions are fixed. Every confirmation, correction and hint is written by the model
# from what it sees, in the voice described in `context`.

id: base-install
title: Base battery install (visit 2)
summary: Stack and QR scan, Disco off, inverter, bus and harness, D2I, panels, commissioning, grid test, closeout.
frame_interval_ms: 2000

context: >-
  This is a live, filmed hackathon demonstration for Base Power. The tech is setting up a real Base
  battery module stack, but it is NOT at a customer's house: expect a warehouse, yard or showroom,
  no house wall, no pad, no meter. Never fail a step because the house, wall, pad or site is missing;
  judge only the battery and what the tech is doing. Props are limited: the module stack and the top
  panel (a side panel may or may not be present). There is no real Disco, inverter, bus bar,
  harness, D2I cable or breaker at the demo: for those steps the tech either acts the step out at the
  stack (hands clearly placing, connecting, uncapping or routing at the right spot) or shows the
  matching screen of the Base installer app on a phone. Accept a clear, deliberate pretend action or
  the matching app screen as done; do not require the real part. For steps whose part is missing, the
  instruction asks for one simple stand-in action
  (set the top shell, press its edge, show a corner): judge only that stand-in action, and in
  coach_line briefly confirm it and tie it back to the real step (for example "Top shell is flat.
  That is how the inverter must seat.").
  Keep every spoken line to ONE short sentence, about 12 words or fewer. One instruction at a time. Serial labels and app screens are
  shown on a phone screen. Speak like a senior Base field supervisor coaching a new installer:
  formal, precise, calm, technical vocabulary (module stack, Disco, inverter, bus bar, harness,
  D2I, side panels, top panel, commissioning, grid test, islanding, backup, closeout). No slang, no
  jokes, no exclamation marks. Never invent a serial number, reading or measurement you cannot read.
  Be specific and physical: name the part and where it is, using what is actually visible, for example
  the Base spec label on the module face with the QR code in its upper right corner, the UN3480
  lithium battery label, the four round mounting studs on the stack's top plate (where the inverter
  seats), the top panel's edges and corners. When correcting, say exactly which part to move, where,
  and which way ("turn the label side toward you", "lower the top panel so its front edge sits flush on
  the front of the stack"). Only name parts you can see or that the step is about.
  Base install facts you may use when relevant: each battery occupies a 3 ft by 3 ft footprint, about
  36 inches tall, on an integrated base; it sits within 1 ft of the wall, within 20 ft of the meter,
  at least 3 ft from gas meters, and never in front of windows, meters or panels. The Disco is Base's
  external disconnect; it must be OFF before any connection is made at the battery.

job:
  customer: Ron Swanson
  address: 2305 Goldsmith St, Houston TX
  job_number: BP-24-1187
  serial: BP2-0418-7731

steps:
  - id: stack-set
    title: Stack set
    say: Set the module stack on flat ground, labels facing you. Then step back.
    why: The stack sits on its integrated base and must be upright and fully seated before any connection is made.
    check: A Base battery module stack is visible, upright and set down on the ground or floor, most of it in frame, with no side panels installed yet.

  - id: qr-scan
    title: QR scan
    say: Scan the unit. Hold the QR corner of the Base label up to the glasses.
    why: The scan ties this serial number to this customer and this job. It is the record of what was installed where.
    check: A QR code or serial label is visible on the battery or on a phone held at it. It does NOT need to be readable, the QR code is small; a clearly visible QR label in frame counts as scanned. If a serial number happens to be readable, report it exactly and repeat it in coach_line; never invent one.

  - id: disco-off
    title: Disco off
    say: Confirm the Disco is off. Show me the pre-check screen in the installer app.
    why: The Disco isolates the battery from the home and the grid. Every connection at the battery is made with it off.
    check: Either the Base installer app pre-check screen showing the Disconnect or Disco as OFF, or a disconnect switch handle clearly in the OFF position.

  - id: inverter
    title: Inverter
    say: The inverter would seat on the top plate. Today, set the top shell on the stack.
    why: In a real install, the inverter seats on the four round mounting studs on the top plate and must sit flat before anything is connected.
    check: The white top shell (top panel) has been set on top of the battery stack and is sitting flat, or the tech is placing it there.

  - id: bus-harness
    title: Bus bar and harness
    say: Press down on the front edge of the top shell. It should not rock.
    why: The bus bar carries battery current from the modules to the inverter; the harness carries its control signals. Both must be fully seated and latched.
    check: The tech's hand is pressing on or running along the front edge of the top shell on the battery stack, and the shell is sitting flat.

  - id: d2i-prep
    title: D2I prep
    say: Show me the back corner where the D2I cable would exit.
    why: The D2I carries power out to the Disco. Its cap stays on until routing so the pins stay clean.
    check: A corner or back edge of the battery stack, with the top shell on it, is shown up close, or the tech is pointing at where a cable would exit.

  - id: panels
    title: Panels and D2I routing
    say: Step back. Show me the whole unit with the top shell on.
    why: In a real install, the four side panels go on first and the top panel locks them in place, with the D2I routed through the panel opening.
    check: The whole battery stack with the white top shell seated on it is in view, shown as one assembled unit.

  - id: commission
    title: Commissioning
    say: Commission the system. Show me the installer app once it reads Online.
    why: Commissioning brings the unit online and confirms it is reporting to Base before the crew leaves.
    check: The Base installer app commissioning screen is shown and reads Online, with its checks passing.

  - id: grid-test
    title: Grid test
    say: Grid test. Turn off the grid breaker, then show me the grid test screen.
    why: The grid test proves the home islands onto the battery when utility power is lost. That is the backup the customer is paying for.
    check: The Base installer app grid test screen is shown with the grid OFF or open, or a breaker handle is clearly being switched off.

  - id: grid-verify
    title: Backup verified
    say: Hold on that screen until it says the test passed.
    why: Verification confirms the battery carried the load with the grid off. Restore the breaker so the unit resynchronizes to the grid.
    check: The Base installer app grid test screen shows the test passed, for example the home running on battery or backup verified.

  - id: closeout
    title: Closeout photo
    say: Closeout photo. Step back about six feet, unit centered.
    why: The closeout photo is the permanent record of the finished install for the customer file and the inspector.
    check: The assembled battery (stack with side and top panel) is shown from the front, fully in frame, reasonably level and in focus.

watch:
  - id: hands-in-live-enclosure
    when: Bare hands are inside the open battery stack touching terminals, bus bars or exposed conductors.
    say: ''
    cooldown_s: 30

  - id: debris-on-unit
    when: Tools, packaging, screws or debris are left on top of the battery or its panels after the enclosure is closed.
    say: ''
    cooldown_s: 45
