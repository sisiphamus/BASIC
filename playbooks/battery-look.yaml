# Walk around an installed Base battery and capture each part, so we can see what a real unit looks like.
# Every check passes as soon as that part is clearly in view.

id: battery-look
title: Battery walkaround (photo survey)
summary: Show the battery, its label, status light, surroundings, wiring and the wall disconnect, one at a time.
frame_interval_ms: 2000

steps:
  - id: whole-unit
    title: Whole battery
    say: Stand a few steps back and look at the whole battery.
    check: A home battery is visible, most or all of it in frame. It counts if it is either a finished battery enclosure (a white or gray cabinet, possibly with its door open) or a stack of gray battery modules, indoors or outdoors.
    pass_say: Got the whole unit.
    hint: Step back so the whole battery fits in view.

  - id: nameplate
    title: Label or nameplate
    say: Now get close to the label or nameplate on the battery.
    check: A product label, nameplate or sticker with printed text on the battery or its enclosure is close enough that some text is readable.
    pass_say: Got the label.
    hint: Get closer to the label, about a foot away.

  - id: status-light
    title: Status light
    say: Find the status light or display on the battery and look straight at it.
    check: An indicator light, LED strip, logo light, screen or status display on the battery or its enclosure is clearly visible.
    pass_say: Got the status light.
    hint: Look for a light or logo on the front or top of the battery.

  - id: surroundings
    title: Around the battery
    say: Look at the ground and wall around the battery, left side then right side.
    check: The area beside or around the battery is visible, including the floor, ground or pad it sits on.
    pass_say: Got the surroundings.
    hint: Turn your head slowly to show the area around it.

  - id: wiring
    title: Wiring and conduit
    say: Follow the cable or pipe coming out of the battery toward the house.
    check: Electrical conduit, cables, wiring or connectors attached to the battery or running from it are visible.
    pass_say: Got the wiring.
    hint: Look where the cable leaves the battery.

  - id: disconnect
    title: Wall disconnect
    say: Last one. If there's a gray switch box or disconnect nearby where the wiring goes, look at it. If there is none, tap Skip on the phone.
    check: An electrical box, disconnect switch, breaker, meter or panel is visible.
    pass_say: Got the disconnect. That's the full walkaround. Thanks.
    hint: It is usually on the wall near the electric meter.

watch:
  - id: danger
    when: Something looks unsafe, such as an open cabinet door with exposed wiring, smoke, scorch marks, or standing water on the equipment.
    say: ''
    cooldown_s: 30
